<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>E2C | Boolean Expression to Logic Circuit Converter</title>
    <meta name="title" content="E2C | Boolean Expression to Logic Circuit Converter">
    <meta name="description" content="Free online tool to instantly convert boolean algebra expressions into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">
    <meta name="keywords" content="boolean algebra, logic circuit, logic gates, truth table generator, computer science, digital logic, boolean to circuit, AND OR NOT gates">
    <meta name="author" content="DevwithAnTic">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/DevwithAnTic/E2C">
    <meta property="og:title" content="E2C | Boolean Expression to Logic Circuit Converter">
    <meta property="og:description" content="Free online tool to instantly convert boolean algebra expressions into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://github.com/DevwithAnTic/E2C">
    <meta property="twitter:title" content="E2C | Boolean Expression to Logic Circuit Converter">
    <meta property="twitter:description" content="Free online tool to instantly convert boolean algebra expressions into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="shortcut icon" href="favicon/favicon.ico">

    <link rel="stylesheet" href="style.css">
    
    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "E2C Logic Circuit Converter",
      "url": "https://github.com/DevwithAnTic/E2C",
      "description": "Convert boolean expressions into interactive logic gate circuits and truth tables instantly.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <!-- Main App Wrapper -->
    <main class="container">
        <h1>Expression to Logic Circuit Converter</h1>
        
        <!-- Input Form -->
        <section class="input-section" aria-label="Expression Input Area">
            <label for="equation">Enter Boolean Expression:</label>
            <div class="input-group">
                <input type="text" id="equation" name="equation" placeholder="e.g. (x + y)' xy" aria-label="Boolean Expression Input" aria-describedby="equation-help">
                <button id="generate-btn" aria-label="Generate Logic Circuit">Generate Circuit</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <p id="equation-help" class="help-text" style="margin-top: 0;">Variables: single letters (A, x, y). AND: . or * or implicit (xy). OR: +. NOT: ' (x').</p>
                <label style="font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 11px; display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="optimize-btn" style="margin-right: 5px;"> Optimize Gates (Reuse)
                </label>
                <label style="font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 11px; display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="multi-input-btn" style="margin-right: 5px;"> Multi-Input Gates (A+B+C)
                </label>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" id="show-labels" checked>
                    Show Gate Labels
                </label>
            </div>
        </section>
        
        <script>
            // Restore checkbox states from localStorage
            ['optimize-btn', 'multi-input-btn', 'show-labels'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const saved = localStorage.getItem(id);
                if (saved !== null) {
                    el.checked = saved === 'true';
                }
                el.addEventListener('change', () => {
                    localStorage.setItem(id, el.checked);
                    // auto-generate circuit if inputs change
                    if (document.getElementById('equation').value.trim()) {
                        document.getElementById('generate-btn').click();
                    }
                });
            });
        </script>
        
        <div class="error-msg" id="error-msg" role="alert" aria-live="assertive"></div>

        <section class="output-section" aria-label="Generated Circuit Output">
            <div class="circuit-container">
                <canvas id="circuit-canvas" width="800" height="400" aria-label="Interactive Logic Circuit Diagram" role="img">
                    Your browser does not support the HTML canvas tag.
                </canvas>
            </div>
            <div class="summary-container" id="summary-container">
                <h2>
                    <!-- custom hand-coded pixel art icon for the retro look! -->
                    <svg width="20" height="20" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" style="margin-right: 4px;">
                        <rect x="2" y="10" width="3" height="5" fill="#0000aa" stroke="#000" stroke-width="1"></rect>
                        <rect x="6" y="5" width="3" height="10" fill="#00aa00" stroke="#000" stroke-width="1"></rect>
                        <rect x="10" y="2" width="3" height="13" fill="#aa0000" stroke="#000" stroke-width="1"></rect>
                    </svg>
                    Circuit Summary
                </h2>
                <div id="summary-content" aria-live="polite">
                    <!-- Summary will be injected here -->
                </div>
                
                <h2 style="margin-top: 2rem;">
                    <svg width="20" height="20" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" style="margin-right: 4px;">
                        <rect x="1" y="2" width="14" height="12" fill="#ffffff" stroke="#000" stroke-width="1"></rect>
                        <rect x="1" y="2" width="14" height="3" fill="#0000aa" stroke="#000" stroke-width="1"></rect>
                        <line x1="6" y1="2" x2="6" y2="14" stroke="#000" stroke-width="1"></line>
                        <line x1="11" y1="2" x2="11" y2="14" stroke="#000" stroke-width="1"></line>
                        <line x1="1" y1="5" x2="15" y2="5" stroke="#000" stroke-width="1"></line>
                        <line x1="1" y1="8" x2="15" y2="8" stroke="#000" stroke-width="1"></line>
                        <line x1="1" y1="11" x2="15" y2="11" stroke="#000" stroke-width="1"></line>
                    </svg>
                    Truth Table
                </h2>
                <div id="truth-table-container" aria-live="polite">
                    <!-- Truth table will be injected here -->
                </div>
            </div>
        </section>
        
        <!-- Retro Status Bar Footer -->
        <footer class="status-bar" aria-label="Application Status">
            <div class="status-tip">Tip: Use mouse wheel to zoom, click and drag to pan.</div>
            <div class="status-credits">
                Built by <a href="https://github.com/DevwithAnTic/E2C" target="_blank" rel="noopener noreferrer">DevwithAnTic</a> | CC BY-NC 4.0
            </div>
        </footer>
    </main>
    <script src="app.js"></script>
</body>
</html>
