<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Equation to Logic Circuit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Equation to Logic Circuit Converter</h1>
        <div class="input-section">
            <label for="equation">Enter Boolean Equation:</label>
            <div class="input-group">
                <input type="text" id="equation" placeholder="e.g. (x + y)' xy">
                <button id="generate-btn">Generate Circuit</button>
            </div>
            <p class="help-text">Variables: single letters (A, x, y). AND: . or * or implicit (xy). OR: +. NOT: ' (x').</p>
        </div>
        
        <div class="error-msg" id="error-msg"></div>

        <div class="output-section">
            <div class="circuit-container">
                <canvas id="circuit-canvas" width="800" height="400"></canvas>
            </div>
            <div class="summary-container" id="summary-container">
                <h3 style="display: flex; align-items: center; gap: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Circuit Summary
                </h3>
                <div id="summary-content">
                    <!-- Summary will be injected here -->
                </div>
                
                <h3 style="margin-top: 2rem; display: flex; align-items: center; gap: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    Truth Table
                </h3>
                <div id="truth-table-container">
                    <!-- Truth table will be injected here -->
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
