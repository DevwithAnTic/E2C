<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>E2C | Boolean Equation to Logic Circuit Converter</title>
    <meta name="title" content="E2C | Boolean Equation to Logic Circuit Converter">
    <meta name="description" content="Free online tool to instantly convert boolean algebra equations into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">
    <meta name="keywords" content="boolean algebra, logic circuit, logic gates, truth table generator, computer science, digital logic, boolean to circuit, AND OR NOT gates">
    <meta name="author" content="DevwithAnTic">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/DevwithAnTic/E2C">
    <meta property="og:title" content="E2C | Boolean Equation to Logic Circuit Converter">
    <meta property="og:description" content="Free online tool to instantly convert boolean algebra equations into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://github.com/DevwithAnTic/E2C">
    <meta property="twitter:title" content="E2C | Boolean Equation to Logic Circuit Converter">
    <meta property="twitter:description" content="Free online tool to instantly convert boolean algebra equations into interactive logic gate circuits. Generates truth tables and step-by-step logic summaries.">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="shortcut icon" href="favicon/favicon.ico">

    <link rel="stylesheet" href="style.css">
    
    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "E2C Logic Circuit Converter",
      "url": "https://github.com/DevwithAnTic/E2C",
      "description": "Convert boolean equations into interactive logic gate circuits and truth tables instantly.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <main class="container">
        <h1>Equation to Logic Circuit Converter</h1>
        <section class="input-section" aria-label="Equation Input Area">
            <label for="equation">Enter Boolean Equation:</label>
            <div class="input-group">
                <input type="text" id="equation" name="equation" placeholder="e.g. (x + y)' xy" aria-label="Boolean Equation Input" aria-describedby="equation-help">
                <button id="generate-btn" aria-label="Generate Logic Circuit">Generate Circuit</button>
            </div>
            <p id="equation-help" class="help-text">Variables: single letters (A, x, y). AND: . or * or implicit (xy). OR: +. NOT: ' (x').</p>
        </section>
        
        <div class="error-msg" id="error-msg" role="alert" aria-live="assertive"></div>

        <section class="output-section" aria-label="Generated Circuit Output">
            <div class="circuit-container">
                <canvas id="circuit-canvas" width="800" height="400" aria-label="Interactive Logic Circuit Diagram" role="img">
                    Your browser does not support the HTML canvas tag.
                </canvas>
            </div>
            <div class="summary-container" id="summary-container">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Circuit Summary
                </h2>
                <div id="summary-content" aria-live="polite">
                    <!-- Summary will be injected here -->
                </div>
                
                <h2 style="margin-top: 2rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    Truth Table
                </h2>
                <div id="truth-table-container" aria-live="polite">
                    <!-- Truth table will be injected here -->
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
